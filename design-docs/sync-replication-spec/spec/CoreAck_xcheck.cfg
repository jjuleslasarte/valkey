\* Small CoreAck config for the TLC-Lean cross-check. TLC dumps the full state
\* graph with -dump dot.
CONSTANTS
    Nodes = {n1, n2, n3}
    InitPrim = n1
    MaxLen = 1
    MaxVer = 5
    ReconcileFirst = TRUE
    EarlyDrop = FALSE
    NoReplyFence = FALSE
SPECIFICATION ASpec
INVARIANTS TypeOK EligibleHoldsCommitted CommittedAgree AckedDurable AckedHeld HeldInv TermLe
